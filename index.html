<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Lyretail Web</title>
    <style>
      body { font-family: sans-serif; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; background-color: #f0f0f0; }
      #main { width: 80%; max-width: 800px; margin: auto; padding: 20px; background-color: white; box-shadow: 0 0 10px rgba(0,0,0,0.1); }
    </style>
  </head>
  <body>
    <div id="main"></div>
    <!-- This script will be generated by wasm-pack -->
    <script type="module">
        import init from './pkg/lyretail.js'; // Adjust if your package name is different
        async function run() {
            await init();
        }
        run();
    </script>
  </body>
</html>
